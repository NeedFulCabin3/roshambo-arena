<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        
        <div class="score-board">
            <div class="score">
                <span class="label">Player</span>
                <span id="player-score">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div class="battle-arena">
            <div class="hand" id="player-hand">❓</div>
            <div class="vs">VS</div>
            <div class="hand" id="computer-hand">❓</div>
        </div>

        <div class="results-display">
            <p id="game-message">Choose your weapon to start!</p>
        </div>

        <div class="choices-container">
            <button class="choice-btn" data-choice="rock">✊ Rock</button>
            <button class="choice-btn" data-choice="paper">✋ Paper</button>
            <button class="choice-btn" data-choice="scissors">✌️ Scissors</button>
        </div>

        <button id="reset-btn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
